<div id="auth-modal" class="auth-modal">
  <div class="auth-box">
    <span class="auth-close" onclick="document.getElementById('auth-modal').classList.remove('show')">&times;</span>

    <h2>Регистрация</h2>

    <input id="email" placeholder="Твоя почта">
    <input id="password" type="password" placeholder="Пароль">

    <button onclick="register()">Зарегистрироваться</button>
    <button onclick="login()">Войти</button>

    <p id="result"></p>

    <h2>Мой профиль</h2>

    <input id="nickname" placeholder="Твой никнейм">

    <button onclick="saveNickname()">Сохранить никнейм</button>

    <p id="profileResult"></p>
  </div>
</div>

<script>
  // Показать модалку через 1 секунду
  setTimeout(() => {
    document.getElementById('auth-modal').classList.add('show');
  }, 1000);

  async function register() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const result = document.getElementById("result");

      if (!email || !password) {
          result.textContent = "Введите почту и пароль";
          return;
      }

      const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password
      });

      if (error) {
          result.textContent = "Ошибка: " + error.message;
          return;
      }

      result.textContent = "Регистрация прошло успешна!";
      console.log("User:", data.user);
  }

  async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const result = document.getElementById("result");

      if (!email || !password) {
          result.textContent = "Введите почту и пароль";
          return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
      });

      if (error) {
          result.textContent = "Ошибка входа: " + error.message;
          return;
      }

      result.textContent = "Ты вошёл как " + data.user.email;
  }

  async function saveNickname() {
      const nickname = document.getElementById("nickname").value.trim();
      const profileResult = document.getElementById("profileResult");

      if (!nickname) {
          profileResult.textContent = "Введи ник";
          return;
      }

      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
          profileResult.textContent = "Сначала войди в аккаунт!";
          return;
      }

      const { error } = await supabase
          .from("profiles")
          .upsert({ id: user.id, nickname: nickname });

      if (error) {
          profileResult.textContent = "Ошибка: " + error.message;
          return;
      }

      profileResult.textContent = "Ник сохранён: " + nickname;
  }
</script>

  <script>
    const body = document.body;

    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      body.style.setProperty('--x', x + '%');
      body.style.setProperty('--y', y + '%');
    });

    document.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const x = (touch.clientX / window.innerWidth) * 100;
      const y = (touch.clientY / window.innerHeight) * 100;
      body.style.setProperty('--x', x + '%');
      body.style.setProperty('--y', y + '%');
    }, { passive: true });
  </script>
